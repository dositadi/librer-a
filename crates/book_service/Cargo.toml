[package]
name = "book_service"
version = "0.1.0"
edition = "2024"
default-run = "app"

[[bin]]
name = "app"
path = "src/bin/app.rs"

[[bin]]
name = "migration"
path = "src/bin/migration.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
envconfig = "0.11.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "json",
    "registry",
] }
tower = { version = "0.5.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "request-id"] }
jiff = "0.2.37"
uuid = { version = "1.26.1", features = ["v7", "fast-rng"] }
toasty = { version = "0.10.0", features = ["migration", "jiff", "postgresql"] }
toasty-cli = "0.10.0"
